[project]
name = "cutile-gpt"
version = "0.2.1"
description = "High-performance GPT implementation using NVIDIA CUDA Tile Programming"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.13"
authors = [
    {name = "Hwoo Joo", email = "ceo@falconoon.com"}
]
keywords = [
    "cuda",
    "gpu",
    "gpt",
    "transformer",
    "tile-programming",
    "deep-learning",
    "nvidia",
    "cupy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: GPU :: NVIDIA CUDA",
]

# Core dependencies only - minimal for cutile kernels.
#
# cuda-tile provides the `cuda.tile` module every kernel imports, and tileiras
# (its compiler) requires the CUDA 13.1+ toolchain, so cupy must be a cuda13
# build - a cuda12 build cannot load kernels built by it.
#
# bfloat16 is what every current open-weight model ships in, and reaching it
# takes both of the floors below: ml_dtypes registers the numpy dtype so
# `cp.dtype("bfloat16")` resolves, and cupy 14 is the first release whose
# `from_dlpack` accepts a bfloat16 tensor (13.x raises NotImplementedError).
# The kernels themselves are already dtype-generic - none of them changed.
dependencies = [
    "cuda-tile>=1.5.0",
    "cupy-cuda13x>=14.0.0",
    "ml-dtypes>=0.5.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
# HuggingFace integration
hf = [
    "transformers>=4.30.0",
    "datasets>=3.0.0",
    "tiktoken>=0.8.0",
]

# PyTorch for comparison/benchmarking
torch = [
    "torch>=2.0.0",
]

# Visualization tools
viz = [
    "plotly>=5.0.0",
    "matplotlib>=3.0.0",
    "pandas>=2.0.0",
    "seaborn>=0.13.0",
    "kaleido>=0.2.0",
]

# Development tools
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

# All optional dependencies
all = [
    "cutile-gpt[hf,torch,viz,dev]",
]

[project.urls]
Homepage = "https://github.com/falcons-eyes/cutileGPT"
Repository = "https://github.com/falcons-eyes/cutileGPT"
Documentation = "https://github.com/falcons-eyes/cutileGPT#readme"
Issues = "https://github.com/falcons-eyes/cutileGPT/issues"
Changelog = "https://github.com/falcons-eyes/cutileGPT/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cutile_gpt"]

[tool.hatch.build.targets.sdist]
include = [
    "cutile_gpt/**/*.py",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "external/",
    "docs/",
    "scripts/",
    "profiling_results/",
    "mlir_research/",
    "*.mp4",
    "media/",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Submodules and render output are not ours to lint.
extend-exclude = ["external", "media", "mlir_research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Manim scenes use `from manim import *`, which is the library's documented
# idiom - every Mobject and animation is expected to be in scope unqualified.
"cutile_intro.py" = ["F403", "F405"]
"cutile_deepdive.py" = ["F403", "F405"]
# Scripts bootstrap sys.path for the minGPT submodule before importing.
"scripts/comprehensive_comparison.py" = ["E402"]
# pytest.importorskip has to run before the imports it guards.
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
